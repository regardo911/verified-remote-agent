# Chapter 7: immutable checkout and the actual offline repository suite.
name: offline-suite

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: ./ci/format-check
      - run: ./ci/type-check
      - run: ./ci/unit-test
